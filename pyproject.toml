[project]
name = "kb-repomap"
version = "0.1.0"
description = "Aider repository maps and native Codex v2 compaction for repository knowledge bases"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PyYAML>=6.0,<7",
  "diskcache==5.6.3",
  "grep-ast==0.9.0",
  "networkx==3.4.2",
  "numpy>=2.3,<2.5",
  "pathspec==0.12.1",
  "pygments==2.19.2",
  "scipy>=1.16.1,<1.18",
  "tiktoken==0.12.0",
  "tqdm==4.67.3",
  "tree-sitter==0.25.2",
  "tree-sitter-language-pack==0.13.0",
]

[tool.uv]
package = false

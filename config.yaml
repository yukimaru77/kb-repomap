# Target input size for every first-stage blob, including repository-map.txt.
# Token budgets here are doubled automatically for gpt-6.1-sol (see kb_api.CONTEXT_SCALE).
chunk_tokens: 150000
map_tokens: 10000

# Pack layout. directory: pack files by directory (legacy). domain: the model designs about
# `count` cross-layer DOMAIN windows (UI+BFF+Gateway+DB+tests+docs of one feature) of at most
# `max_tokens` source tokens; the layout is stored with the KB and reused by later rebuilds.
# Each window is compacted with `reading_instructions` ({NAME}/{RATIONALE} are filled in).
windows:
  mode: domain
  count: 11
  max_tokens: 400000
  reading_instructions: domain-reading-instructions.txt

# Second-stage compaction is opt-in: group by blob count or measured output tokens.
two_stage:
  enabled: false
  mode: tokens              # tokens: total output tokens; count: number of blobs
  count: 4                  # blobs per group when mode is count
  token_budget: 150000

# Used by both v2 compaction (repository map generation has no LLM).
model: gpt-6.1-sol
effort: xhigh

# Operational tuning.
workers: 12
max_file_bytes: 600000
thin_blob_threshold: 2000
